name: Build KNR Sportverse APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk KNR-Sportverse.apk

      - uses: actions/upload-artifact@v4
        with:
          name: KNR-Sportverse-APK
          path: KNR-Sportverse.apk

      # Publishes a permanent direct-download link under the repo's Releases page
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0-${{ github.run_number }}
          name: KNR Sportverse v1.0 (build ${{ github.run_number }})
          files: KNR-Sportverse.apk
